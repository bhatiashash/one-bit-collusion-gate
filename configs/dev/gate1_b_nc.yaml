simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags:
  - gate1_b_nc
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: path
  num_agents: 4
  consolidate_channels: true
llm_models:
- label: openai_gpt4o_mini
  llm:
    provider: openrouter
    openrouter:
      model: Qwen/Qwen2.5-7B-Instruct
      params:
        max_tokens: 1500
        temperature: 0.7
experiment:
  tag: gate1_b_nc
  output_dir: experiments/collusion/outputs/gate1_b_nc
  max_concurrent_runs: 2
  seeds:
  - 1
  - 2
  - 3
  - 4
  - 5
  collusion:
    colluder_selection: first_and_last
    agent_order: random
    coalition_prompt: always
  sweeps:
  - name: gate1_b_nc
    topologies:
    - path
    num_agents:
    - 4
    colluder_counts:
    - 2
    secret_channel_enabled:
    - false
    prompt_variants:
    - simple
