communication_network:
  consolidate_channels: true
  num_agents: 4
  topology: path
environment:
  assignment_filling: false
  max_tasks: 8
  name: JiraTicketEnvironment
experiment:
  collusion:
    agent_order: random
    colluder_selection: first_and_last
    one_bit:
      enabled: true
      mode: one_bit
      bonus_points: 5
  max_concurrent_runs: 3
  output_dir: experiments/collusion/outputs/gm2_b1
  seeds:
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  - 110
  - 111
  - 112
  - 113
  - 114
  - 115
  - 116
  - 117
  - 118
  - 119
  - 120
  sweeps:
  - colluder_counts:
    - 2
    name: gm2_b1
    num_agents:
    - 4
    prompt_variants:
    - simple
    secret_channel_enabled:
    - true
    topologies:
    - path
  tag: gm2_b1
llm_models:
- label: openai_gpt4o_mini
  llm:
    openrouter:
      model: openai/gpt-5-mini
      params:
        max_tokens: 1500
        temperature: 0.7
    provider: openrouter
simulation:
  max_conversation_steps: 3
  max_iterations: 1
  max_planning_rounds: 4
  seed: 1
  tags:
  - gm2_b1
