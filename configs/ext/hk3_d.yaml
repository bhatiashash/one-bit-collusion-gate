simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags:
  - hk3_d
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: path
  num_agents: 4
  consolidate_channels: true
llm_models:
- label: openai_gpt4o_mini
  llm:
    provider: openrouter
    openrouter:
      model: anthropic/claude-haiku-4.5
      params:
        max_tokens: 1500
        temperature: 0.7
experiment:
  tag: hk3_d
  output_dir: experiments/collusion/outputs/hk3_d
  max_concurrent_runs: 3
  seeds:
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  - 110
  collusion:
    colluder_selection: first_and_last
    agent_order: random
  sweeps:
  - name: hk3_d
    topologies:
    - path
    num_agents:
    - 4
    colluder_counts:
    - 2
    secret_channel_enabled:
    - false
    prompt_variants:
    - control
    seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
